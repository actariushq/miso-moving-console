<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미소 이사 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 좌측 레일(모듈) + 작업 영역(요약 → 큐/보드) + 우측 상세 드로어. 운영 콘솔이라 장식 없이 상태를 형태로 인코딩 */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --muted:#5A6776; --faint:#8994A1;
  --line:#DCE2E8; --line-strong:#C3CCD5;
  --accent:#1D56C9; --accent-ink:#FFFFFF; --accent-soft:#E3ECFB;
  --ok:#1C7F52; --ok-soft:#E1F3EA; --warn:#A8690F; --warn-soft:#FBF0DC; --bad:#BF3328; --bad-soft:#FBE6E3;
  --rail:#15202B; --rail-ink:#C9D3DD; --rail-active:#FFFFFF;
  --shadow:0 12px 32px rgba(21,32,43,.16);
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --surface-2:#1E2833; --ink:#E6ECF2; --muted:#9AA7B5; --faint:#6D7A88;
  --line:#28333F; --line-strong:#3A4755;
  --accent:#6E9CF5; --accent-ink:#0C1624; --accent-soft:#1C2C48;
  --ok:#4DC08A; --ok-soft:#15352A; --warn:#E3A847; --warn-soft:#3A2D14; --bad:#F07A6E; --bad-soft:#40201D;
  --rail:#0A0F14; --rail-ink:#9AA7B5; --rail-active:#FFFFFF; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --surface-2:#1E2833; --ink:#E6ECF2; --muted:#9AA7B5; --faint:#6D7A88;
  --line:#28333F; --line-strong:#3A4755;
  --accent:#6E9CF5; --accent-ink:#0C1624; --accent-soft:#1C2C48;
  --ok:#4DC08A; --ok-soft:#15352A; --warn:#E3A847; --warn-soft:#3A2D14; --bad:#F07A6E; --bad-soft:#40201D;
  --rail:#0A0F14; --rail-ink:#9AA7B5; --rail-active:#FFFFFF; --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{color:var(--rail-active);font-size:16px;letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--rail-ink)}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h6{margin:0 0 4px;padding:0 8px;font-size:11px;font-weight:500;letter-spacing:.08em;color:#7D8A98}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--rail-ink);text-decoration:none;font-size:14px}
.nav:hover{background:rgba(255,255,255,.06)}
.nav[aria-current="page"]{background:rgba(255,255,255,.1);color:var(--rail-active);font-weight:600}
.nav .cnt{font-family:var(--f-mono);font-size:12px;opacity:.8}
.nav .cnt.hot{color:#FF9A8F;opacity:1}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 8px;font-size:12px}
.rail-foot label{color:#7D8A98}
.rail-foot select{background:#223040;border:1px solid #34445A;border-radius:6px;padding:6px 8px;color:#E6ECF2}
.sample{display:inline-block;font-size:11px;color:#F2C46B;border:1px solid #6B5629;border-radius:4px;padding:1px 6px;margin-top:6px}
/* main */
.main{padding-block:22px 40px;padding-inline:28px;min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{margin:0;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.today{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--faint)}
.kpi .v.bad{color:var(--bad)} .kpi .v.ok{color:var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
input.search{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:5px 10px;min-width:0;width:220px;max-width:100%}
.section-title{display:flex;align-items:baseline;gap:8px;margin:0;font-size:15px}
.section-title small{color:var(--muted);font-weight:400;font-size:12px}
/* board */
.board-wrap{overflow-x:auto;margin-inline:-4px;padding:0 4px 6px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(244px,1fr);gap:10px;min-width:min-content}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:0}
.col-h{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.col-h .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.col-h .t .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.col-h .d{font-size:11.5px;color:var(--faint);line-height:1.4}
.col.risk{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.col-b{padding:8px;display:flex;flex-direction:column;gap:8px}
.code{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--surface);border:1px solid var(--line-strong);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px 10px 13px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;text-align:left;width:100%}
.card:hover{border-color:var(--line-strong)}
.card:focus-visible,.nav:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:transparent}
.card.sla-warn::before{background:var(--warn)} .card.sla-bad::before{background:var(--bad)}
.card .r1{display:flex;align-items:center;gap:6px;min-width:0}
.card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .r1 .rt{margin-left:auto;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500;font-family:var(--f-mono)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 6px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.chip.mv{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.solid{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.next{font-size:12px;display:flex;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:6px;color:var(--muted)}
.next .when{font-family:var(--f-mono);color:var(--ink)}
.next .when.over{color:var(--bad);font-weight:600}
.empty{font-size:12px;color:var(--faint);padding:10px 4px;text-align:center}
/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:980px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface-2);white-space:nowrap;letter-spacing:.02em}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;width:96px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.bar .goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.share{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px}
.trucks{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.trucks b{color:var(--ink);font-weight:500}
/* booking queue */
.queue{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.qrow{display:grid;grid-template-columns:70px minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) 120px;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surface-2)}
.qrow .why{font-size:12px;color:var(--muted)}
.dd{font-family:var(--f-mono);font-weight:600;font-size:13px;padding:2px 8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-strong);text-align:center}
.dd.d4,.dd.d5{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.dd.d3{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ruler{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.ruler i{height:5px;border-radius:1px;background:var(--line)}
.ruler i.on{background:var(--accent)} .ruler i.now{background:var(--ink)}
.slots{display:flex;gap:3px;align-items:center}
.slots i{width:12px;height:12px;border-radius:2px;border:1px solid var(--line-strong)}
.slots i.shown{background:var(--accent);border-color:var(--accent)}
.slots i.hidden{background:repeating-linear-gradient(45deg,var(--line-strong) 0 2px,transparent 2px 4px)}
/* log */
.log{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.lrow{display:grid;grid-template-columns:110px 84px minmax(0,1fr) 110px;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start;font-size:13px}
.lrow:last-child{border-bottom:0}
.lrow .ts{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lrow .subj{font-weight:600;cursor:pointer;color:var(--accent);background:none;border:0;padding:0;text-align:left}
.lrow .body{color:var(--muted);font-size:12.5px;margin-top:2px}
.lrow .who{font-size:12px;color:var(--muted);text-align:right}
.kind{font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;text-align:center;white-space:nowrap}
.kind.stage{background:var(--accent-soft);color:var(--accent)}
.kind.call{background:var(--ok-soft);color:var(--ok)}
.kind.note{background:var(--warn-soft);color:var(--warn)}
.kind.field{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.kind.system{background:var(--surface-2);color:var(--faint);border:1px dashed var(--line-strong)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.dh .top{display:flex;align-items:center;gap:8px}
.dh h2{margin:0;font-size:18px;letter-spacing:-.01em;min-width:0}
.dh .x{margin-left:auto;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:16px;flex:none}
.db{overflow-y:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:20px}
.blk{display:flex;flex-direction:column;gap:10px}
.blk h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.grid2 div{background:var(--surface);padding:8px 10px;display:flex;flex-direction:column}
.grid2 span{font-size:11.5px;color:var(--muted)} .grid2 b{font-family:var(--f-mono);font-weight:600;font-size:15px}
.form{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>label{font-size:12px;color:var(--muted);min-width:64px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.f span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=datetime-local],select,textarea{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.radio{display:flex;flex-wrap:wrap;gap:6px}
.radio button,.tag{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.radio button[aria-pressed="true"],.tag[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{font-size:12px;color:var(--bad)}
.ok-msg{font-size:12px;color:var(--ok)}
.check{display:flex;flex-direction:column;gap:2px}
.check label{display:flex;gap:8px;align-items:center;padding:4px 2px;font-size:13px;cursor:pointer}
.pinned{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:var(--warn-soft);border-radius:6px;padding:8px 10px;font-size:13px}
.pinned b{font-size:11px;color:var(--warn);margin-right:6px}
.tl{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:5px}
.tl .it{position:relative;padding:0 0 12px 16px}
.tl .it::before{content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.tl .it.stage::before{border-color:var(--accent);background:var(--accent)}
.tl .it.call::before{border-color:var(--ok)}
.tl .it.note::before{border-color:var(--warn)}
.tl .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.tl .h b{font-weight:600}
.tl .h .ts{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.tl .b{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.flow div{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--faint);min-width:0}
.flow div i{height:4px;border-radius:2px;background:var(--line)}
.flow div.done{color:var(--ink)} .flow div.done i{background:var(--accent)}
.flow div.cur{color:var(--accent);font-weight:600} .flow div.cur i{background:var(--accent);opacity:.45}
.flow small{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);font-weight:400}
.quotes{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.q{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px}
.q:last-child{border-bottom:0}
.q.hid{background:var(--surface-2);color:var(--faint)}
.q.hid .nm{text-decoration:line-through}
.q .rk{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.q .amt{font-family:var(--f-mono);font-weight:600}
.rule{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:8px 10px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:6px;font-size:13px;z-index:30;box-shadow:var(--shadow)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px}
  .navgroup{flex-direction:row;flex-wrap:wrap;align-items:center}
  .navgroup h6{display:none}
  .rail-foot{margin:0;flex-direction:row;align-items:center;flex-wrap:wrap}
  .main{padding-inline:16px}
  .qrow{grid-template-columns:60px minmax(0,1fr);}
  .qrow .hide-sm{display:none}
  .lrow{grid-template-columns:78px minmax(0,1fr)}
  .lrow .who,.lrow .kind-c{display:none}
}
@media (prefers-reduced-motion:no-preference){.drawer.anim{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
/* v0.2 additions: 콜 폼 · 터치 케이던스 · 콜 로그 */
.step{display:flex;flex-direction:column;gap:6px}
.step>.lbl{font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.step>.lbl i{font-style:normal;font-family:var(--f-mono);width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--surface);display:inline-grid;place-items:center;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips button.suggest{border-color:var(--accent);border-style:dashed}
.chips button .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.preview{border-radius:6px;padding:9px 11px;font-size:12.5px;background:var(--accent-soft);color:var(--ink);display:flex;flex-direction:column;gap:3px}
.preview b{font-weight:600}
.preview .rule{background:none;padding:0;color:var(--muted);font-family:var(--f-mono);font-size:11px}
.recent{display:flex;flex-direction:column;gap:6px}
.recent .rc{border-left:3px solid var(--line-strong);padding:4px 0 4px 10px;font-size:12.5px}
.recent .rc .h{color:var(--muted);font-size:11.5px;font-family:var(--f-mono)}
.recent .rc.connected{border-color:var(--ok)} .recent .rc.absent{border-color:var(--warn)} .recent .rc.fail{border-color:var(--bad)}
.cadence{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.cadence .t{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:6px;padding:6px 6px;font-size:11px;min-width:0;background:var(--surface)}

  if(cf.connect==='absent') return plan.close ? (mod==='booking'?'BX_LOST':mod==='am_new'?'N_RISK':'A_RISK') : (mod==='booking'&&['B1','B2'].includes(s)?'B3':s);
  if(cf.connect==='dead'||cf.connect==='refuse') return mod==='booking'?'BX_LOST':mod==='am_new'?'N_CHURN':'A_RISK';
  if(cf.connect==='connected'){
    if(cf.result==='fail') return mod==='booking'?'BX_LOST':mod==='am_new'?'N_CHURN':'A_RISK';
    if(mod==='booking' && ['B1','B3'].includes(s) && cf.result) return 'B2';
  }
  return s;
}

function bookingConversion(){
  const fin=Object.values(O).filter(o=>!openBooking(o));
  const w=fin.filter(o=>callsOf(o).some(c=>c.connect==='connected')); const wo=fin.filter(o=>!callsOf(o).some(c=>c.connect==='connected'));
  const r=a=>a.length?Math.round(a.filter(o=>o.stage==='B4_WON').length/a.length*100):0;
  return {withCall:r(w), without: wo.length? r(wo) : 22};
}

const CL = {range:14, mod:'all', who:'all', conn:'all', moved:false, memo:false, types:['call','sms']};

  return LOG.filter(e=>CL.types.includes(e.type) && e.ts>=from && (CL.mod==='all'||e.module===CL.mod) && (CL.who==='all'||e.actor===CL.who)
    && (CL.conn==='all'|| (e.type==='call' && (CL.conn==='fail'? e.result==='fail' : CL.conn==='other'? ['dead','refuse','etc'].includes(e.connect) : e.connect===CL.conn)))
    && (!CL.moved || (e.type==='call' && e.stageAfter!==e.stageAt)) && (!CL.memo || (e.memo||'').trim())
    && matchQ((e.subject==='partner'?PN(e.sid):e.sid+' '+(O[e.sid]||{}).cust)+' '+(e.memo||'')+' '+(e.purpose||'')));
}
function stats(rows){
  const calls=rows.filter(e=>e.type==='call'); const g=new Map(); calls.forEach(e=>{ if(!g.has(e.group)) g.set(e.group,e); });
  const u=[...g.values()]; const con=u.filter(e=>e.connect==='connected');

});
document.addEventListener('change',e=>{
  if(e.target.id==='cl-who'){ CL.who=e.target.value; render(); return; }
  if(e.target.id==='cl-moved'){ CL.moved=e.target.checked; render(); return; }
  if(e.target.id==='cl-memo'){ CL.memo=e.target.checked; render(); return; }
  if(e.target.id==='cf-purpose'&&CF){ CF.purpose=e.target.value; return; }
  if(e.target.id==='cf-touch'&&CF){ CF.touch=e.target.value||null; const m=$('#cf-memo'); if(m) CF.memo=m.value; refresh(true); return; }
  const c=e.target.closest('[data-ck]'); if(c){ const x=cur(); x.checklist[c.dataset.ck]=c.checked;
    push({type:'field',ts:new Date(NOW),subject:'partner',sid:x.id,actor,title:`체크리스트 ${c.checked?'완료':'해제'}: ${CHECK.find(z=>z[0]===c.dataset.ck)[1]}`,memo:''},true); refresh(true); }});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ q=e.target.value; const pos=e.target.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); } if(e.target.id==='cf-memo'&&CF) CF.memo=e.target.value; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&openKey) closeDrawer(); if(e.key==='Enter'&&e.target.matches('tr[data-open]')) openDrawer(e.target.dataset.open); });
const actorSel=$('#actor'); actorSel.innerHTML=STAFF.map(s=>`<option value="${s.id}">${s.name} · ${s.role}</option>`).join(''); actorSel.onchange=()=>{actor=actorSel.value; render();};
function route(){ const h=location.hash.replace('#',''); view=['am-new','am-active','booking','calls'].includes(h)?h:'am-new'; filter='all'; q=''; closeDrawer(); render(); }
window.addEventListener('hashchange',route); route();
})();
</script>
</body></html>
